<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boardlyBgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="boardlyGoldGrad" x1="60" y1="60" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE875"/>
      <stop offset="40%" stop-color="#F2B90C"/>
      <stop offset="100%" stop-color="#D49A00"/>
    </linearGradient>
    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F2B90C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Canvas Base with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#boardlyBgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#boardlyGoldGrad)" stroke-width="12" stroke-opacity="0.5" />

  <!-- Embedded Logo Graphic: Stylized Geometric "B" with Academic Shield / Cap Motif -->
  <g filter="url(#goldGlow)">
    <!-- Main "B" Spine & Loops -->
    <path d="M140 100 H260 C320 100 360 130 360 185 C360 220 335 245 295 256 C345 270 375 300 375 345 C375 405 325 435 255 435 H140 V100 Z" fill="url(#boardlyGoldGrad)" />
    
    <!-- Cutout Spaces inside B -->
    <path d="M205 155 H250 C275 155 295 165 295 188 C295 210 275 220 250 220 H205 V155 Z" fill="#0C0C0C" />
    <path d="M205 275 H255 C285 275 305 288 305 315 C305 342 285 355 255 355 H205 V275 Z" fill="#0C0C0C" />
    
    <!-- Academic Cap Diamond Accent Top Right -->
    <polygon points="360,95 425,120 360,145 295,120" fill="url(#boardlyGoldGrad)" />
  </g>
</svg>
